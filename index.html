<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>剝蚵仔模擬器</title><link rel="stylesheet" href="./src/style.css"/></head>
<body><canvas id="c"></canvas>
<div id="hud">
 <div id="top"><span id="timer">03:00</span><span id="count">🦪 0</span><span id="pearls">⚪ 0</span><button id="dexBtn">珍珠圖鑑</button></div>
 <div id="gauge"><div id="zone"></div><div id="fill"></div></div>
 <div id="hint">按住撬開蚵仔，在金色區間放開！</div>
 <div id="label"></div>
</div>
<div id="bubbles"></div>
<div id="overlay" class="panel show"><h1>剝蚵仔模擬器</h1>
 <p>暗暝的巷仔口，你是厝邊阿婆之一，坐佇細條椅仔頂，佮大家圍咧剝蚵仔。</p>
 <ul><li>電腦：移動滑鼠看四周；按住滑鼠（或空白鍵）撬蚵仔，在<b>金色區間</b>放開</li>
 <li>手機：手指拖曳看四周；按住不動撬蚵仔，在金色區間放開</li>
 <li>一班 3 分鐘，比看看誰剝最多，搶「今日蚵后」！偶爾會撥到珍珠喔～</li></ul>
 <button id="start">開始剝蚵</button></div>
<div id="dex" class="panel"><h2>珍珠圖鑑</h2><div id="dexList"></div><button id="dexClose">關閉</button></div>
<div id="result" class="panel"><h2 id="resTitle"></h2><div id="resBody"></div><button id="again">再剝一工</button></div>
<script type="module" src="./src/main.ts"></script></body></html>
